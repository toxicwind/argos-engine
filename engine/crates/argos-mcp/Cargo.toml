[package]
name = "argos-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Model Context Protocol (MCP) stdio server exposing the canonical ARGOS agent operations (search, memory, second-brain graph, field map, reference-code) as thin proxies to an ES-compatible ARGOS endpoint, plus the Corpus Hub ask/def/find tools"

# Library first: the `argos mcp` subcommand on the main binary calls
# `argos_mcp::run`, so a user with the installed `argos` binary already has the
# MCP server. The standalone binary below is a thin wrapper over the same entry
# point (CI builds and smoke-tests it).
[lib]
name = "argos_mcp"
path = "src/lib.rs"

[[bin]]
name = "argos-mcp"
path = "src/main.rs"

[dependencies]
# Async runtime (needs `io-std` for stdin/stdout, `rt-multi-thread`, `macros`).
tokio = { workspace = true }
# HTTP client used to proxy every tool call to the running ARGOS engine.
# Inherits the workspace's default-features=false + rustls-tls config, so it
# builds in the same offline/cross-compile matrix as the rest of the tree.
reqwest = { workspace = true }
# Same proxy matcher reqwest consults (`HTTP(S)_PROXY`, `ALL_PROXY`, `NO_PROXY`).
# Used to name the proxy in a failure. The client still lets reqwest apply it.
# Loopback targets never reach this: they are built with `no_proxy()` (#2379).
hyper-util = { version = "0.1.20", default-features = false, features = ["client-proxy"] }
http = "1"
# All request/response bodies are handled as untyped JSON `Value`s — no
# bespoke serde structs, which keeps the wire contract identical to what the
# engine already accepts.
serde_json = { workspace = true }
anyhow = { workspace = true }
# The feedback invitation, shared with every other --help surface so the five
# cannot drift apart.
argos-common = { path = "../argos-common" }
# The `rerank` argument's limits and its validator. Depending on the crate the
# node itself validates with means the tool description quotes the real
# ceilings and the builder refuses exactly what the node would refuse — the
# two cannot drift. A light leaf: it adds no dependency this crate lacks.
argos-rerank = { path = "../argos-rerank" }
# The `max_tokens` budget (#1058) counts with ARGOS's StandardTokenizer —
# UAX #29 word boundaries via `unicode_words()`. Depended on directly (the
# same crate and the same call argos-fts's StandardTokenizer makes,
# engine/crates/argos-fts/src/analyzer.rs) rather than pulling the whole FTS
# stack into this thin proxy; the count is identical by construction.
# See src/token_budget.rs.
unicode-segmentation = "1"
# Corpus Hub v2 (plan §7): the `argos_hub_*` tools run the `argos ask` flow
# itself (`argos_hub::ask`), the one implementation the CLI and the gRPC
# service share — the tools are adapters, not a second copy of the flow.
argos-hub = { path = "../argos-hub" }
# `argos_index_budget` walks a folder and prices it before hashing. The walk,
# the flood-stage allocation parse, and the plan list live in argos-autoindex;
# this crate only exposes them. No cycle: autoindex does not depend on mcp.
argos-autoindex = { path = "../argos-autoindex" }

[dev-dependencies]
# The loopback admin-key fallback tests sandbox cwd + HOME so discovery sees
# only the key files the test wrote (same pattern as argos-autoindex's cli
# tests, where the helper was born).
tempfile = { workspace = true }
# The hub tools' end-to-end test answers from a real in-process node holding a
# restored fixture corpus (the keystone's mini-c), as `argos-hub`'s own tests do.
argos-api = { path = "../argos-api" }
argos-engine = { path = "../argos-engine" }
axum.workspace = true
