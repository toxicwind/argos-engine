[package]
name = "argos-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Integration crate that wires together all argos subsystems"

[dependencies]
argos-common  = { path = "../argos-common" }
argos-storage = { path = "../argos-storage" }
argos-fts     = { path = "../argos-fts" }
argos-vector  = { path = "../argos-vector" }
argos-logs    = { path = "../argos-logs" }
argos-query   = { path = "../argos-query" }
argos-compress = { path = "../argos-compress" }
argos-ai      = { path = "../argos-ai" }
argos-wasm    = { path = "../argos-wasm" }
argos-cluster = { path = "../argos-cluster" }

tokio      = { workspace = true }
# `MetadataApplier` is an async-trait. Already in the tree via argos-cluster.
async-trait = "0.1"
# `join_all` for the hybrid legs (#939). Already in the lockfile via the
# workspace's `futures`; no new crate is pulled in.
futures-util = "0.3"
serde      = { workspace = true }
serde_json = { workspace = true }
simd-json  = { workspace = true }
memchr     = { workspace = true }
tracing    = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
dashmap    = { workspace = true }
arc-swap   = { workspace = true }
parking_lot = "0.12"
# WAL tap (#320): the outbound `_bulk` sender. Already in the tree via
# argos-ai, so this adds no new external dependency.
reqwest    = { workspace = true }
rayon      = { workspace = true }
libc       = "0.2"
uuid       = { workspace = true }
sha2       = "0.10"   # v0.9 9-P4 — audit log hash chain
chrono     = { workspace = true }
chrono-tz  = "0.8"
bytes      = { workspace = true }
regex      = "1"

# Fast non-cryptographic hash — used to shard the engine FTS memtable
# by doc_id so concurrent bulk ingest batches target different shards.
# Also seeds the `code_blocks` parsed-tree cache key (#174 follow-up).
xxhash-rust = { workspace = true }
# FxHash for the memtable hot maps (postings, field_lengths, doc-values)
# — SipHash was >21% of on-CPU time under the shard write locks at c8.
rustc-hash = { workspace = true }

# --- AST-aligned `_passage` for code hits (#174 follow-up, `code_blocks`).
# Same grammar versions as `argos-autoindex`'s ingest-time extractor
# (`argos-autoindex/src/extract/code.rs`) — this module re-parses at RESPONSE
# time rather than depending on that crate (autoindex depends on the engine,
# not the other way around; a reverse dependency would be circular). ---
tree-sitter = { workspace = true }
tree-sitter-python = "0.23"
tree-sitter-c = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-bash = "0.23"

[features]
default = []
# Built-in neural BERT embedder (candle). Propagates to argos-ai. Off by
# default so the standard build stays lean and cross-compiles without the
# candle/tokenizer toolchain; enable via argos-server's `neural` feature.
neural = ["argos-ai/neural"]
onnx-experimental = ["argos-ai/onnx-experimental"]
stackprobe = []
# Pause points inside `Index::refresh` (#2234). Release builds leave this
# off. `argos-api`'s dev-dependency enables it so an HTTP test can hold one
# index's refresh and prove a sibling index is not waiting behind it.
refresh-test-hook = []

[dev-dependencies]
argos-storage = { path = "../argos-storage", features = ["test-hooks"] }
# `raw-api` exposes `DashMap::shards()`, which is the only way to assert what
# #873 fixed: that a per-index cache's shard array is capped rather than sized
# from the host core count. Dev-only: with resolver = "2" it never reaches the
# release binary's graph.
dashmap   = { workspace = true, features = ["raw-api"] }
tempfile  = { workspace = true }
# `test-util` is what lets a test pause tokio's clock (`start_paused = true`)
# and step a background timer deterministically instead of sleeping through it.
# Dev-only: with resolver = "2" it never reaches the release binary's graph.
tokio     = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "search_bench"
harness = false
