[package]
name = "argos-rerank"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Pluggable relevance reranking for argos — calibrated second-stage scoring over retrieved candidates"

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# The local judge's semantic arm (issue #1060): the node's local decision
# head — argos-ai's candle NLI pair scorer — scored against a relevance
# hypothesis. Optional so the default build of this leaf crate stays
# dependency-light; the deterministic lexical arm needs none of it.
argos-ai = { path = "../argos-ai", optional = true }

[features]
default = []
# Wire the local judge to the candle decision head (same loader, same model
# directory, same shared registry as `argos-ai/decide-local`).
judge-local = ["dep:argos-ai", "argos-ai/decide-local"]

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
