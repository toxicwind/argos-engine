version: "3.9"

services:
  argos:
    build: .
    container_name: argos
    restart: unless-stopped
    ports:
      - "8080:8080"   # Native REST API
      - "9200:9200"   # Elasticsearch-compatible REST API
      - "8081:8081"   # gRPC API
    volumes:
      - argos-data:/data
    environment:
      ARGOS_LOG: info
      # The image already sets both (see Dockerfile): argos defaults to a
      # loopback bind, which inside a container means nothing published on
      # `ports:` above would ever answer. Repeated here so the exposure is
      # visible in the file you actually edit — the published ports are
      # cleartext HTTP, so put TLS in front of them before this leaves a
      # trusted network.
      ARGOS_BIND_ADDRESS: "0.0.0.0"
      ARGOS_ALLOW_INSECURE_NETWORK_BIND: "true"
    command: ["--data-dir", "/data"]

volumes:
  argos-data:
    driver: local
